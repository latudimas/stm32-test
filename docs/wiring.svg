<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" width="1100" height="780" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Blue Pill wiring: SSD1306, proposed MPU9250 shared I2C bus, and ST-Link</title>
  <desc>Logical connections, not physical pin order. OLED and proposed MPU9250 share PB6 SCL, PB7 SDA, 3.3 volts and ground. MPU9250 breakout supply and straps must be confirmed before wiring.</desc>
  <rect width="1100" height="780" fill="#fff"/>
  <text x="40" y="28" font-size="17" font-weight="bold" fill="#222">Robot eyes + motion sensor — proposed MPU9250 wiring</text>
  <text x="40" y="50" font-size="12" fill="#a33">Reported GY-9250/6500 style; verify power, pull-ups and straps. Logical layout, not pin order.</text>

  <!-- Shared rails: dots indicate connections; crossings without dots do not. -->
  <g fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M140 200 V280 H500 V450 M470 200 V280" stroke="#d62828"/>
    <path d="M90 200 V300 H450 V450 M420 200 V300" stroke="#222"/>
    <path d="M190 200 V320 H600 V450 M520 200 V320" stroke="#b37d00"/>
    <path d="M240 200 V340 H650 V450 M570 200 V340" stroke="#1f77b4"/>
    <!-- Existing debugger connections -->
    <path d="M830 200 V380 H750 V450" stroke="#e76f00"/>
    <path d="M875 200 V410 H1020 V490 H860" stroke="#d62828"/>
    <path d="M920 200 V400 H1000 V525 H860" stroke="#2a9d38"/>
    <path d="M965 200 V390 H980 V560 H860" stroke="#8e44ad"/>
    <path d="M1010 200 H1040 V595 H860" stroke="#222"/>
  </g>
  <g>
    <circle cx="470" cy="280" r="5" fill="#d62828"/>
    <circle cx="420" cy="300" r="5" fill="#222"/>
    <circle cx="520" cy="320" r="5" fill="#b37d00"/>
    <circle cx="570" cy="340" r="5" fill="#1f77b4"/>
  </g>
  <g font-size="12" font-weight="bold">
    <text x="265" y="274" fill="#d62828">3.3 V</text>
    <text x="265" y="297" fill="#222">GND</text>
    <text x="265" y="318" fill="#906400">SCL (PB6)</text>
    <text x="265" y="359" fill="#1f77b4">SDA (PB7)</text>
  </g>

  <!-- SSD1306 -->
  <rect x="50" y="85" width="230" height="115" rx="8" fill="#1d3557" stroke="#0b1d33" stroke-width="2"/>
  <text x="165" y="76" font-size="13" text-anchor="middle">SSD1306 128x64 · 0x3C</text>
  <rect x="85" y="100" width="160" height="64" rx="3" fill="#000"/>
  <rect x="125" y="109" width="19" height="45" rx="9.5" fill="#b5edff"/>
  <rect x="181" y="109" width="19" height="45" rx="9.5" fill="#b5edff"/>
  <g font-size="11" fill="#fff" text-anchor="middle">
    <text x="90" y="191">GND</text><text x="140" y="191">VCC</text>
    <text x="190" y="191">SCL</text><text x="240" y="191">SDA</text>
  </g>

  <!-- MPU9250: proposed, breakout-specific checks remain open -->
  <rect x="390" y="85" width="230" height="115" rx="8" fill="#24634a" stroke="#133f2d" stroke-width="2"/>
  <text x="505" y="76" font-size="13" text-anchor="middle">MPU9250 · 0x68 (AD0 low)</text>
  <text x="505" y="111" font-size="12" fill="#fff" text-anchor="middle">GY-9250/6500 style*</text>
  <text x="505" y="134" font-size="11" fill="#e3f6e9" text-anchor="middle">nCS → 3.3 V; AD0 → GND*</text>
  <text x="505" y="153" font-size="11" fill="#e3f6e9" text-anchor="middle">INT / FSYNC / AUX: see notes</text>
  <g font-size="11" fill="#fff" text-anchor="middle">
    <text x="420" y="191">GND</text><text x="470" y="191">VCC*</text>
    <text x="520" y="191">SCL</text><text x="570" y="191">SDA</text>
  </g>

  <!-- Debug probe -->
  <rect x="805" y="85" width="230" height="115" rx="8" fill="#5b5f66" stroke="#333" stroke-width="2"/>
  <text x="920" y="76" font-size="13" text-anchor="middle">ST-Link V2.1 (WeAct)</text>
  <text x="920" y="122" font-size="12" fill="#fff" text-anchor="middle">USB-C to host</text>
  <text x="920" y="143" font-size="11" fill="#ddd" text-anchor="middle">SWD + USB-UART</text>
  <g font-size="10" fill="#fff" text-anchor="middle">
    <text x="830" y="191">RXD</text><text x="875" y="191">3V3</text>
    <text x="920" y="191">SWDIO</text><text x="965" y="191">SWCLK</text><text x="1010" y="191">GND</text>
  </g>

  <!-- Blue Pill: logical pin placement -->
  <rect x="380" y="450" width="480" height="165" rx="8" fill="#1e5fbf" stroke="#103a78" stroke-width="2"/>
  <g font-size="12" fill="#fff" text-anchor="middle">
    <text x="450" y="472">GND</text><text x="500" y="472">3.3</text>
    <text x="600" y="472">PB6</text><text x="650" y="472">PB7</text><text x="750" y="472">PA9</text>
  </g>
  <g font-size="10" fill="#d7e6ff" text-anchor="middle">
    <text x="600" y="490">I2C1 SCL</text><text x="650" y="504">I2C1 SDA</text>
    <text x="750" y="490">USART1 TX</text>
  </g>
  <rect x="550" y="525" width="135" height="65" rx="5" fill="#191919"/>
  <text x="617" y="551" font-size="12" fill="#ccc" text-anchor="middle">STM32F103</text>
  <text x="617" y="573" font-size="11" fill="#ccc" text-anchor="middle">Blue Pill</text>
  <g font-size="11" fill="#fff" text-anchor="end">
    <text x="850" y="494">3.3</text><text x="850" y="529">DIO</text>
    <text x="850" y="564">CLK</text><text x="850" y="599">GND</text>
  </g>
  <text x="617" y="637" font-size="12" text-anchor="middle">BOOT0 = 0, BOOT1 = 0 · shared bus at 400 kHz</text>

  <!-- Safety and optional signals -->
  <g font-size="12" fill="#333">
    <text x="40" y="674">* Photo-review report only: VCC 3–5 V is conditional on matching specs; use 3.3 V, verify regulator.</text>
    <text x="40" y="695">  I2C mode: nCS high; AD0 low = 0x68 (high = 0x69). Do not override a hard-wired strap.</text>
    <text x="40" y="716">  FSYNC → GND (check bias first); INT, EDA and ECL disconnected. Exact sensor model unverified.</text>
    <text x="40" y="737">  Pull-ups must go to 3.3 V; check combined OLED + sensor pull-ups. All boards share GND.</text>
    <text x="40" y="758">  One power source only: probe 3V3 OR board USB. No 5 V on I2C. Optional NRST → R unchanged.</text>
  </g>
</svg>
